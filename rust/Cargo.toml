[package]
name = "meeting-bot"
version = "1.0.0"
edition = "2021"
description = "Unified meeting bot example in Rust: join a meeting and print calendar_botevent webhooks"
publish = false

[dependencies]
base64 = "0.22"
ctrlc = "3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
