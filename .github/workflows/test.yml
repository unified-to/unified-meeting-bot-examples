# Runs all four examples against the mock Unified API on every push, using the
# oldest Node.js, Python and Go versions the READMEs promise.
name: test

on:
  push:
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check TypeScript
        working-directory: typescript
        run: npm ci && npm run typecheck

      - name: Check Go
        working-directory: go
        run: test -z "$(gofmt -l .)" && go vet ./...

      - name: Check Rust
        working-directory: rust
        run: cargo fmt --check && cargo clippy --release -- -D warnings

      - name: Run every example against the mock
        run: ./scripts/test-all.sh
